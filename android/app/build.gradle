apply plugin: 'com.android.application'

android {
    namespace 'com.kaoyan.memory'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.kaoyan.memory'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 50604
        versionName '5.6.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // 真机是 arm64-v8a；x86_64 只给模拟器用，打进来白白多 25MB。
        // 本地模型是给手机用的功能，模拟器跑不动 1GB 模型，直接排除。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 签名说明：不在仓库中存放任何私钥。
    // 调试包由 Android 自动生成的默认 debug 证书签名，任何人 clone 后都能直接构建。
    // 正式发布请用自己的 release keystore 在本机配置（不要提交到仓库），例如：
    //   signingConfigs {
    //       release {
    //           storeFile file(System.getenv('RELEASE_KEYSTORE'))
    //           storePassword System.getenv('RELEASE_STORE_PASSWORD')
    //           keyAlias System.getenv('RELEASE_KEY_ALIAS')
    //           keyPassword System.getenv('RELEASE_KEY_PASSWORD')
    //       }
    //   }
    // 注意：换成自己的证书后，老版本无法直接覆盖安装，需要卸载后重装。

    buildTypes {
        debug {
            // 使用 Android 默认 debug 证书
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 未配置签名：发布前请按上面的说明提供自己的 release keystore
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    // v3.9.0：端侧推理引擎（java-llama.cpp 的安卓预编译 AAR）。
    // 只打 arm64-v8a + x86_64；用 ABI 分包避免把 x86 也塞进每台手机的 apk。
    implementation 'net.ladenthin:llama-android:5.1.0'

    // v4.2.0：音乐播放器。Media3 ExoPlayer 播放本地 content:// 音频。
    // 可行性文档已验证 1.4.1 在 compileSdk 34 / AGP 8.2.1 下可编译。
    implementation 'androidx.media3:media3-exoplayer:1.4.1'

    // v4.9.0：播放通知 / 锁屏控制。MediaSessionCompat + MediaStyle 通知，
    // 走成熟的 androidx.media，和现有 ExoPlayer 通过插件静态引用桥接，不动播放内核。
    implementation 'androidx.media:media:1.7.0'

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'
